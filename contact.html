<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | CyberFix360</title>
  <meta name="description" content="Contact CyberFix360 about cyber security, compliance and assurance services.">
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>html { scroll-behavior: smooth; scroll-padding-top: 80px; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-white flex flex-col">

  <nav class="sticky top-0 z-50 bg-black border-b border-slate-800 px-8 py-3 flex flex-wrap justify-between items-center gap-3">
    <a href="index.html" aria-label="CyberFix360 home"><img src="logo.png" alt="CyberFix360" class="h-14 w-auto"></a>
    <div class="flex flex-wrap gap-6 text-sm items-center">
      <a href="index.html#about" class="hover:text-cyan-400 transition">About</a>
      <a href="services.html" class="hover:text-cyan-400 transition">Services</a>
      <a href="contact.html" class="hover:text-cyan-400 transition">Contact</a>
    </div>
  </nav>

  <main class="flex-grow max-w-4xl w-full mx-auto px-10 py-20">
    <h1 class="text-3xl font-bold mb-4">Contact us</h1>
    <p class="text-slate-300 mb-8">Send us a message below and we will get back to you.</p>
    <div class="bg-slate-900 rounded-3xl p-8 border border-slate-800">

      <form action="https://formspree.io/f/xwlonwzl" method="POST" class="grid gap-4">
        <input name="name" required class="bg-slate-800 p-3 rounded-xl" placeholder="Name" aria-label="Name">
        <input name="email" type="email" required class="bg-slate-800 p-3 rounded-xl" placeholder="Email" aria-label="Email">

        <div>
          <label for="query" class="block text-sm text-slate-300 mb-1">Query</label>
          <textarea id="query" name="query" required rows="5" maxlength="1000" class="w-full bg-slate-800 p-3 rounded-xl" placeholder="Briefly, what are you contacting us about?"></textarea>
        </div>

        <input name="company" class="bg-slate-800 p-3 rounded-xl" placeholder="Company" aria-label="Company">

        <button type="submit" class="bg-cyan-500 text-black px-5 py-3 rounded-2xl font-semibold hover:bg-cyan-400 transition">Send enquiry</button>
      </form>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-900 px-10 py-8 text-sm text-slate-400">
    <div class="max-w-6xl mx-auto flex flex-wrap justify-between gap-4">
      <p>© 2026 CyberFix360. All rights reserved.</p>
      <p>Registered company details and privacy policy to be added.</p>
    </div>
  </footer>
</body>
</html>
